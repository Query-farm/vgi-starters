# Variables substituted into shared/*.tmpl for the Java starter.
lang = "java"
lang_title = "Java"
sdk_name = "vgi-java"
sdk_repo = "https://github.com/Query-farm/vgi-java"
rpc_docs = "https://vgi-rpc-java.query.farm"
prereqs = "JDK 25 or newer (`java` on the PATH or `JAVA_HOME` set; Gradle comes with the wrapper)"
location_example = "launch:/abs/path/to/vgi-starter-java/bin/vgi-starter-worker"
metadata_file = "`src/main/java/farm/query/starter/Meta.java` and each function's `metadata()`"
version_file = "`build.gradle.kts`"
release_summary = "The release workflow builds the shaded jar (`./gradlew shadowJar`) and attaches it to the GitHub release as `vgi-starter-java-<tag>.jar` with a SHA-256 checksum, so users can download it and run `java -jar vgi-starter-java-v0.1.0.jar`."
logging = "Log through SLF4J (`org.slf4j.LoggerFactory.getLogger(...)`); the bundled `slf4j-simple` backend writes to stderr. `--debug` turns on debug logging."
state_note = "Table-function state is a `TableProducerState` subclass with a public no-arg constructor. Over HTTP each batch can be served by a different request, so its non-transient fields travel with the request in a token the SDK encrypts (ChaCha20-Poly1305) with the worker's key. Keep them small; mark caches `transient`. The SDK gives per-batch code no access to the call's secrets, so `fetch_items` carries its token in a state field: acceptable only because of that encryption."
recipes_run = """
```sql
ATTACH 'aggregate' (TYPE vgi, LOCATION '/abs/path/bin/recipes aggregate');
```

`make build` also builds `build/recipes/recipes.jar`; `bin/recipes <recipe>` serves one recipe from it.
The recipe sources are in `examples/src/farm/query/starter/recipes/`, one class per recipe plus
the `Recipes` dispatcher. They use only the SDK, Arrow and the JDK (plus the sqlite-jdbc driver for
`pushdown_sqlite`)."""
lint_location = "bin/vgi-starter-worker"
writable_api = "`CatalogTable.Builder.insertFunction` / `updateFunction` / `deleteFunction`"
writable_docs = """
A writable table is a `CatalogTable` whose builder names a table in-out function per operation
with `insertFunction`, `updateFunction` and `deleteFunction`, and the richest result each one
produces with `writeResultMode`. The `farm.query.vgi.write` package reads DuckDB's
`write_options` argument (`WriteOptions.from`) and builds the result
(`WriteResults.resultSchema`, `WriteResults.resultBatch`); UPDATE and DELETE need a
`WriteResults.rowIdField()` column emitted by a scan with projection pushdown. Transactions:
`Worker.onAttach` decides `supports_transactions` per ATTACH and `Worker.transactionHooks` runs
your begin / commit / rollback code. Since VGI protocol 3.3 a table's scan and write functions
are table-only: hidden from `duckdb_functions()` and not callable from SQL. Set
`.exposeScan(true)` on the table to keep the scan callable as an ordinary table function too
(write functions never are). These need vgi-java 0.48.0 or newer: if `gradle.lockfile` has an
older 0.48.x, run `./gradlew dependencies --write-locks` (the newest 0.48.x; every 0.48.x speaks
the same protocol). See
[Writable tables, transactions and ATTACH options](https://github.com/Query-farm/vgi-java/blob/main/docs/writable-tables-and-transactions.md)."""
