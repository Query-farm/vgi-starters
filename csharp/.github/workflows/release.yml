name: Release

# Push a tag like v0.1.0 (or run it by hand). This gates on CI, checks the tag against
# Directory.Build.props, publishes a self-contained single-file executable per platform
# (no .NET install needed to run it), signs each archive with cosign, records SLSA build
# provenance, and attaches everything to the GitHub release.
#
# Not NativeAOT: the SDK uses ASP.NET Core, DuckDB.NET's native library and reflection.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  ci:
    # In the template repositories a vX.Y.Z tag is a template version, not a worker
    # release, so only a manual run builds there. Forks release on every tag.
    if: ${{ github.event_name != 'push' || !startsWith(github.repository, 'Query-farm/vgi-starter-') }}
    uses: ./.github/workflows/ci.yml

  check-version:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Directory.Build.props
        if: startsWith(github.ref, 'refs/tags/')
        run: ci/check-version.sh "${GITHUB_REF_NAME}"

  build:
    name: Build (${{ matrix.rid }})
    needs: [check-version]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write        # create the release, attach assets
      id-token: write        # keyless signing + provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64,   os: macos-latest }
          - { rid: win-x64,     os: windows-latest, ext: ".exe" }
    defaults:
      run:
        shell: bash
    env:
      NAME: vgi-starter-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        run: |
          # The lock file covers every RID in <RuntimeIdentifiers>; restoring with -r would
          # narrow the RID set and fail locked mode (NU1004).
          dotnet restore src/Starter.Worker --locked-mode
          dotnet publish src/Starter.Worker -c Release --no-restore -r "${{ matrix.rid }}" --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "out/${{ matrix.rid }}"
      - name: Archive
        id: archive
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" == v* ]] || tag="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          staging="$(mktemp -d)"
          cp "out/${{ matrix.rid }}/${NAME}${{ matrix.ext }}" README.md LICENSE "$staging/"
          base="${NAME}-${tag}-${{ matrix.rid }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd "$staging" && 7z a -tzip "$GITHUB_WORKSPACE/dist/${base}.zip" . >/dev/null)
            archive="dist/${base}.zip"
          else
            tar -C "$staging" -czf "dist/${base}.tar.gz" .
            archive="dist/${base}.tar.gz"
          fi
          (cd dist && f="$(basename "$archive")" && { sha256sum "$f" 2>/dev/null || shasum -a 256 "$f"; } > "${base}.sha256")
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: cosign sign-blob --yes --bundle "${{ steps.archive.outputs.path }}.cosign.bundle" "${{ steps.archive.outputs.path }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.archive.outputs.path }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/
      - name: Upload to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
