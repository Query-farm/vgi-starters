[package]
name = "vgi-starter-worker"
version = "0.1.0"
edition = "2021"
# The vgi SDK's MSRV.
rust-version = "1.97"
description = "A VGI worker for DuckDB, generated from the Query.Farm VGI starter template."
license = "0BSD"
repository = "https://github.com/Query-farm/vgi-starter-rust"
readme = "README.md"
publish = false
# examples/ holds one recipe dispatcher (examples/run.rs) plus its modules, not
# one standalone example per file.
autoexamples = false

[lib]
name = "starter_worker"
path = "src/lib.rs"

[[bin]]
name = "vgi-starter-worker"
path = "src/main.rs"

[[example]]
name = "recipes"
path = "examples/run.rs"

[dependencies]
# SDK bumps go through the template (a minor bump can raise the wire protocol,
# which must match the DuckDB extension exactly). Default features include the
# HTTP transport (`--http`) and the SQLite store that backs COPY TO shards.
vgi = "0.50.0"
# Arrow at the version vgi is built against.
arrow-array = "59.2"
arrow-schema = "59.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP client (with rustls for https://). Blocking is the right model:
# the SDK calls producers synchronously on every transport.
ureq = "3"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[dev-dependencies]
# The pushdown_sqlite recipe. Same version and features as vgi's own SQLite
# store, so it compiles once.
rusqlite = { version = "0.39", features = ["bundled"] }
# The recipes' Arrow helpers, at vgi's Arrow version.
arrow-cast = "59.2"
arrow-select = "59.2"
arrow-json = "59.2"

[profile.release]
opt-level = 2
