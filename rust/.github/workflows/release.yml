name: Release

# Push a tag like v0.1.0. This gates on CI, then the shared vgi-actions workflow
# builds vgi-starter-worker for every DuckDB platform (linux_amd64, linux_arm64,
# osx_arm64, windows_amd64), packs one .tar.gz per platform, signs each with
# cosign (keyless), attests SLSA provenance and attaches them to the GitHub
# release. Point a DuckDB LOCATION at the binary inside the archive.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-status:
    # A release tag usually points at a commit whose push to main already passed CI.
    # Reuse that result instead of running the whole CI matrix again; otherwise run CI below.
    # In the template repositories a vX.Y.Z tag is a template version, not a worker
    # release, so only a manual run builds there. Forks release on every tag.
    if: ${{ github.event_name != 'push' || !startsWith(github.repository, 'Query-farm/vgi-starter-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq .total_count || echo 0)
          echo "ci.yml successes for ${GITHUB_SHA}: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: [ci-status]
    if: ${{ needs.ci-status.outputs.passed != 'true' }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci-status, ci]
    if: ${{ !cancelled() && needs.ci-status.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    permissions:
      contents: write        # create the release, attach assets
      id-token: write        # keyless signing + provenance
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/rust-release.yml@v1
    secrets: inherit
    with:
      bin: vgi-starter-worker
      version_check_cmd: ci/check-version.sh
