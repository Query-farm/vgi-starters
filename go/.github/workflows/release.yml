name: Release

# Push a tag like v0.1.0. This gates on CI, then the shared vgi-actions workflow
# builds the pure-Go worker (no cgo) on native runners (linux amd64/arm64, macOS arm64,
# Windows amd64), signs each archive with cosign, attests SLSA provenance, and
# attaches them to the GitHub release.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci]
    permissions:
      contents: write        # create the release, attach assets
      id-token: write        # keyless signing + provenance
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/go-release.yml@v1
    secrets: inherit
    with:
      package: ./cmd/vgi-starter-worker
      bin: vgi-starter-worker
      go_version: "1.26"
      # Set to "1" if you import vgi-go/vgi/exprduckdb (Evaluate / AutoApplyFilters).
      cgo: "0"
      version_check_cmd: ci/check-version.sh
