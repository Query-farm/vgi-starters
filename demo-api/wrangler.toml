# The public demo API the VGI starter templates' fetch_items examples call.
# Deploy: npx wrangler deploy   (account: Query.Farm; zone: query-farm.services)
name = "vgi-starter-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "vgi-starter-api.query-farm.services", custom_domain = true },
]

# Per-client-IP limit. Exceeding it returns 429 + Retry-After, which the starters'
# fetch_items honours, so a burst just slows down.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[observability]
enabled = true
