# Keeps GitHub Actions and Python dependencies current. vgi-python minor/major bumps
# are ignored: they can change the wire protocol, which must match the DuckDB
# extension exactly. Take those through template updates (make template-diff).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
    ignore:
      - dependency-name: vgi-python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
